services:
  db:
    image: postgres:17
    container_name: sparringscope-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sparringscope
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: sparringscope
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparringscope -d sparringscope"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
